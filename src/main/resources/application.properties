server.port=${PORT:8080}
spring.application.name=portfolio

# Database: H2 file by default (zero setup). Set DB_URL to use PostgreSQL when deployed.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/portfolio}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Owner login. ALWAYS set ADMIN_USER and ADMIN_PASS as environment variables when you deploy.
admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASS:change-me-now}

