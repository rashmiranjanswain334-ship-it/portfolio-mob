<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Owner login')}"></head>
<body class="font-body antialiased">
<div class="fixed inset-0 -z-10"><canvas id="field" class="h-full w-full"></canvas></div>
<main class="grid min-h-screen place-items-center px-6">
  <div class="enter w-full max-w-sm">
    <a th:href="@{/}" class="text-sm text-muted transition hover:text-saffron">Back to portfolio</a>
    <h1 class="mt-6 font-display text-4xl font-extrabold">Owner login</h1>
    <p class="mt-2 text-muted">Only the site owner can add or edit projects.</p>

    <p th:if="${param.error}" role="alert" class="mt-6 rounded-lg border border-red-400/40 bg-red-400/10 px-4 py-3 text-sm text-red-300">
      Wrong ID or password. Check both and try again.
    </p>
    <p th:if="${param.logout}" role="status" class="mt-6 rounded-lg border border-lagoon/40 bg-lagoon/10 px-4 py-3 text-sm text-lagoon">
      You are logged out.
    </p>

    <form th:action="@{/login}" method="post" class="mt-8 space-y-5">
      <label class="block">
        <span class="mb-1 block text-sm text-muted">ID</span>
        <input class="field" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="block">
        <span class="mb-1 block text-sm text-muted">Password</span>
        <input class="field" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn w-full" type="submit">Log in</button>
    </form>
  </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
